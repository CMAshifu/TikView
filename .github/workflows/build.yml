name: Build TikView APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TikView-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikView-apk
          path: TikView-${{ github.run_number }}.apk

      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TikView build ${{ github.run_number }}
          body: Download **TikView-${{ github.run_number }}.apk** on your Android phone and open it to install.
          files: TikView-${{ github.run_number }}.apk
          make_latest: true
